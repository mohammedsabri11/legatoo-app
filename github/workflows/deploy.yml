name: 🚀 Auto Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "StrictHostKeyChecking no" > ~/.ssh/config

      - name: 🚀 Deploy to VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
          set -e

          echo "🌀 Updating backend..."
          cd ~/legatoo_backend
          git pull origin main
          cd backend
          alembic upgrade head || true
          pm2 restart fastapi-backend || pm2 start uvicorn app.main:app --name fastapi-backend --host 0.0.0.0 --port 8000 &

          echo "🌀 Updating frontend..."
          cd ~/legatoo
          git pull origin main
          cd frontend
          npm install --legacy-peer-deps
          npm run build
          pm2 restart nextjs-frontend || pm2 start npm --name "nextjs-frontend" -- start
          
          echo "✅ Deployment completed successfully!"
          EOF
